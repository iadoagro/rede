<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede — Monitor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/monitor.css">
  <link rel="stylesheet" href="assets/css/topology.css">
  <style>
    /* área de trabalho: uma aba, ou duas lado a lado (meio a meio) */
    #workspace.split { display: flex; align-items: stretch; }
    #workspace.split > .ws-pane:not(.d-none) { flex: 1 1 0; min-width: 0; overflow: auto; height: calc(100vh - 56px); }
    #workspace.split > .ws-pane + .ws-pane:not(.d-none) { border-left: 2px solid var(--border); }
    #workspace.split .nm-layout { height: calc(100vh - 110px); }
    #workspace.split .topo-layout { height: calc(100vh - 110px); grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    #tabTraffic iframe { width: 100%; height: calc(100vh - 56px); border: 0; display: block; }
    #toastContainer { position: fixed; top: 70px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; width: 290px; pointer-events: none; }
    @keyframes toast-in  { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(24px); } }
  </style>
</head>
<body>

<!-- ══ BARRA SUPERIOR ════════════════════════════════════════════════ -->
<header id="appBar" class="appbar">
  <div class="appbar-brand" title="Rede">
    <span class="appbar-logo"><i class="fas fa-circle-nodes"></i></span>
    <div class="appbar-name"><strong>Rede</strong><small>Monitoramento</small></div>
  </div>

  <nav id="mainTabs" class="appbar-tabs" role="tablist">
    <a href="#" data-main-tab="monitor" class="active"><i class="fas fa-gauge-high"></i>Monitor</a>
    <a href="#" data-main-tab="topology"><i class="fas fa-diagram-project"></i>Topologia</a>
    <a href="#" data-main-tab="traffic"><i class="fas fa-chart-line"></i>Tráfego</a>
  </nav>

  <div class="appbar-right">
    <span id="monIndicator" class="nm-pill">PARADO</span>
    <span id="lastScanEl" class="appbar-last"></span>
    <div class="split-ctl">
      <select id="splitWith" class="nm-select-plain d-none" title="Aba ao lado">
        <option value="monitor">Monitor</option>
        <option value="topology">Topologia</option>
        <option value="traffic" selected>Tráfego</option>
      </select>
      <button id="btnSplit" class="nm-btn" type="button" title="Mostrar duas abas lado a lado"><i class="fas fa-table-columns"></i><span>Lado a lado</span></button>
    </div>
    <button id="btnThemeToggle" class="nm-btn nm-btn-icon" type="button" title="Mudar tema"><i class="fas fa-moon"></i></button>
  </div>
</header>

<div id="noBackend" class="alert m-0 d-none" role="alert">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <i class="fas fa-exclamation-triangle me-2"></i>
      <strong>Backend offline.</strong> Execute <code>node server.js</code> e abra <code>http://localhost:3030</code>.
      <span id="retryMsg" class="ms-2" style="font-size:.75rem;opacity:.7"></span>
    </div>
    <button id="btnRetry" class="btn btn-sm">
      <i class="fas fa-rotate me-1"></i>Tentar conexão
    </button>
  </div>
</div>

<!-- ══ CONTEÚDO ══════════════════════════════════════════════════════ -->
<div id="workspace">
  <div id="tabMonitor"  class="ws-pane container-fluid px-3 py-3"></div>
  <div id="tabTopology" class="ws-pane d-none container-fluid px-3 py-3"></div>
  <div id="tabTraffic"  class="ws-pane d-none"><iframe id="trafficFrame" title="Tráfego das portas"></iframe></div>
</div>

<div id="toastContainer"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/topology.js"></script>
<script src="assets/js/rack.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/topo-ports.js"></script>
<script src="assets/js/topo-ui.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const pages = [
      { id: 'tabMonitor',  src: 'pages/monitor.html'  },
      { id: 'tabTopology', src: 'pages/topology.html' },
    ];

    await Promise.all(pages.map(async ({ id, src }) => {
      try {
        const res = await fetch(src);
        if (!res.ok) throw new Error(`${res.status} ${src}`);
        document.getElementById(id).innerHTML = await res.text();
      } catch (e) {
        console.error('Falha ao carregar', src, e);
      }
    }));

    await window.initApp();
  });
</script>

</body>
</html>
